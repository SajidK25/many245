<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AWS Relay Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
        }
        .nav-tabs .nav-link {
            color: #00aaff;
        }
        .nav-tabs .nav-link.active {
            background-color: transparent;
            border-bottom: 2px solid #00aaff;
            color: white;
        }
        .table {
            color: white;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <h3>AWS Relay Data</h3>
    
    <!-- Tabs -->
    <ul class="nav nav-tabs" id="relayTabs">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#inTransit">IN TRANSIT</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#upcoming">UPCOMING</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#history">HISTORY</a>
        </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content mt-3">
        <!-- IN TRANSIT Tab -->
        <div id="inTransit" class="tab-pane fade show active">
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Contract</th>
                            <th>Payout Value</th>
                            <th>Load ID</th>
                            <th>From To</th>
                            <th>Driver Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" class="text-center">No data available</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- UPCOMING Tab -->
        <div id="upcoming" class="tab-pane fade">
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Contract</th>
                            <th>Payout Value</th>
                            <th>Load ID</th>
                            <th>From To</th>
                            <th>Driver Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" class="text-center">No data available</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- HISTORY Tab -->
        <div id="history" class="tab-pane fade">
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Contract</th>
                            <th>Payout Value</th>
                            <th>Load ID</th>
                            <th>From To</th>
                            <th>Driver Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" class="text-center">No data available</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
